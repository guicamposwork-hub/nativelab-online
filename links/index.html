<style>
@font-face { font-family: "Archivo"; src: url("../assets/fonts/archivo-var.woff2") format("woff2-variations"), url("../assets/fonts/archivo-var.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }

:root {
  --lime: #B5FF00;
  --graphite: #161616;
  --black: #000000;
  --white: #FFFFFF;
  --mute: rgba(255, 255, 255, .62);
  --line: rgba(255, 255, 255, .12);
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-liquid: cubic-bezier(.65, 0, .35, 1);
}

* { box-sizing: border-box; margin: 0; }
html { background: var(--black); color-scheme: dark; }
body {
  min-height: 100svh;
  font-family: var(--font);
  color: var(--white);
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(181, 255, 0, .13), transparent 60%),
    var(--black);
  -webkit-font-smoothing: antialiased;
  display: flex;
  justify-content: center;
}

.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  padding: max(40px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  min-height: 100svh;
}

/* ---------- Quem ---------- */
.who { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; padding: 8px 16px 36px; }

.portrait { position: relative; width: 112px; height: 112px; }
.portrait img {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  object-position: 50% 22%;
  background: var(--graphite);
  display: block;
}
/* a gota do logo, encostada no retrato como o ponto do símbolo */
.portrait .drop {
  position: absolute;
  width: 30px; height: 30px;
  right: -6px; bottom: 2px;
  border-radius: 50%;
  background: var(--lime);
  box-shadow: 0 0 0 5px var(--black);
}

.name { font-size: clamp(40px, 11vw, 52px); line-height: .95; letter-spacing: -.035em; }
.name b { font-weight: 900; display: block; }
.name span { font-weight: 200; display: block; }
.role { font-size: 16px; line-height: 1.5; color: var(--mute); max-width: 34ch; }

/* ---------- Fundo: o símbolo 3D em vidro líquido, que os cards refratam ---------- */
.backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.backdrop img {
  position: absolute;
  width: min(165vw, 860px);
  left: 50%; top: 62%;
  transform: translate(-38%, -50%) rotate(-14deg);
  height: auto;
  filter: blur(16px);
  opacity: .7;
  mix-blend-mode: screen;
  -webkit-mask-image: radial-gradient(closest-side, #000 62%, transparent 100%);
  mask-image: radial-gradient(closest-side, #000 62%, transparent 100%);
}

/* ---------- Links em vidro ---------- */
.links { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; }

.link {
  position: relative;
  display: grid;
  grid-template-columns: 48px 1fr;
  align-items: center;
  gap: 16px;
  padding: 18px;
  border-radius: 22px;
  color: inherit;
  text-decoration: none;
  isolation: isolate;
  overflow: hidden;
  background: rgba(18, 18, 18, .46);
  border: 1px solid rgba(255, 255, 255, .14);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-tap-highlight-color: transparent;
  transition: border-color .3s;
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .link { background: rgba(22, 22, 22, .82); }
}
/* marca-texto: o lime preenche o card no toque */
.link::before {
  content: "";
  position: absolute; inset: 0;
  background: var(--lime);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .45s var(--ease-liquid);
  z-index: -1;
}
.link:hover::before, .link:focus-visible::before, .link:active::before { transform: scaleX(1); }
.link:hover, .link:focus-visible, .link:active { color: var(--graphite); border-color: transparent; }
.link:hover .desc, .link:focus-visible .desc, .link:active .desc { font-weight: 400; }
.link:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

.icon {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .07);
  border: 1px solid rgba(255, 255, 255, .14);
  display: grid; place-items: center;
  transition: border-color .3s, background-color .3s;
}
.icon svg { width: 22px; height: 22px; fill: currentColor; }
.link:hover .icon, .link:focus-visible .icon, .link:active .icon { background: rgba(22, 22, 22, .06); border-color: rgba(22, 22, 22, .2); }

.text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.title { font-size: 24px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.desc { font-size: 15px; font-weight: 200; line-height: 1.35; letter-spacing: .005em; }

/* NativeLab: o link que gera projeto já vem marcado */
.link.is-main { color: var(--graphite); border-color: transparent; }
.link.is-main::before { transform: scaleX(1); }
.link.is-main .icon { background: rgba(22, 22, 22, .06); border-color: rgba(22, 22, 22, .2); }
.link.is-main .desc { font-weight: 400; }

/* ---------- Rodapé ---------- */
.foot { margin-top: auto; padding: 48px 16px 0; display: flex; justify-content: center; }
.foot a { color: var(--white); display: block; width: 116px; }
.foot svg { width: 100%; height: auto; display: block; }

/* ---------- Abertura (uma sequência só) ---------- */
@media (prefers-reduced-motion: no-preference) {
  .portrait .drop { animation: drop .9s .15s var(--ease-out) both; }
  .who > :not(.portrait), .links li, .foot { animation: rise .7s var(--ease-out) backwards; }
  .name { animation-delay: .25s; }
  .role { animation-delay: .32s; }
  .links li:nth-child(1) { animation-delay: .42s; }
  .links li:nth-child(2) { animation-delay: .48s; }
  .links li:nth-child(3) { animation-delay: .54s; }
  .links li:nth-child(4) { animation-delay: .60s; }
  .foot { animation-delay: .7s; }
}
@keyframes drop {
  0%   { transform: translateY(-160px) scale(.6); opacity: 0; }
  60%  { transform: translateY(6px) scale(1.08, .92); opacity: 1; }
  80%  { transform: translateY(-3px) scale(.97, 1.03); }
  100% { transform: none; }
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .link::before { transition: none; } }
